{% comment %}
The ink pill button. {% include "emails/_button.html" with href=url label="Do the thing" %}
The colour sits on the cell as well as the link, so Outlook (which ignores
padding on links) still shows a filled button.
{% endcomment %}<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin-top:{{ top|default:'28px' }};">
  <tr>
    <td bgcolor="#1C1916" style="border-radius:999px;">
      <a href="{{ href }}" target="_blank" style="display:inline-block;padding:16px 28px;border-radius:999px;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:20px;font-weight:700;color:#FDFAF5;text-decoration:none;">{{ label }}&nbsp;&rarr;</a>
    </td>
  </tr>
</table>
