<!doctype html>
<html lang="en-NG">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#10b981" />

  <!--
    Favicons come from public/ via scripts/optimize-images.mjs. The previous
    declaration pointed at /src/assets/faith_tribe_logo.jpg — a 574KB photo,
    mislabelled type="image/png", on a path that only resolves because Vite
    rewrites it. Every page load downloaded it.
  -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <!--
    Self-hosted Inter. This replaces an @import of fonts.googleapis.com inside
    index.css, which serialised four round trips before first paint: fetch the
    CSS bundle, parse it, discover the @import, connect to googleapis, then
    connect again to gstatic for the font files. It also pulled all nine
    weights; the app uses five. One variable file covers the whole 100-900 axis
    in 47KB, against 118KB and five requests for the equivalent static weights.
  -->
  <link rel="preload" href="/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin />

  <!--
    The head of a page lives between these two comments.

    Everything in the region below is the fallback: it is what the dev server
    serves, and it is what a browser sees if the build script ever fails to run.
    `scripts/generate-site.mjs` replaces the whole region, per route, with the
    tags `seo/site.mjs` describes — so the copy lives in exactly one place and a
    static file cannot drift from what React renders.

    Do not add tags of your own inside the region; they will be replaced. Tags
    that belong on every page (charset, icons, font preload) go above it.
  -->
  <!--seo:start-->
  <title>Faith Tribe — Daily Devotionals &amp; Bible for RCCG Teens</title>
  <meta name="description"
    content="A few minutes with God, every day. Free daily devotionals, the Bible, study manuals and camp registration for teenagers in RCCG Region 63 Junior Church." />
  <meta name="robots" content="index, follow" />
  <!--seo:end-->
</head>

<body>
  <div id="root"></div>

  <!--
    What a reader without JavaScript gets. One paragraph and the four links that
    lead into the site, written per route by the build script — not a sales page
    hidden from people. It is here because the app is client-rendered: without
    it, a crawler that does not execute JavaScript sees an empty body under a
    perfectly good title.
  -->
  <noscript>
    <!--seo:noscript:start-->
    <div>
      <h1>Faith Tribe</h1>
      <p>A few minutes with God, every day. Free daily devotionals, the Bible, study manuals and camp registration for
        teenagers in RCCG Region 63 Junior Church.</p>
      <ul>
        <li><a href="/devotionals">Today’s devotional</a></li>
        <li><a href="/events">Events and camps</a></li>
        <li><a href="/manuals">Bible study manuals</a></li>
        <li><a href="/media">Podcasts and videos</a></li>
        <li><a href="/help">Help</a></li>
      </ul>
    </div>
    <!--seo:noscript:end-->
  </noscript>

  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
