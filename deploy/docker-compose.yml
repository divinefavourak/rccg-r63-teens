# Production on one VPS: the API, its database, Redis, the Celery worker and
# beat, and Caddy in front for HTTPS. The website and the web app stay on
# Vercel. Full procedure: docs/ops/11-vps-deployment.md.
#
#   cd /srv/faithtribe
#   docker compose -f deploy/docker-compose.yml build
#   docker compose -f deploy/docker-compose.yml run --rm web ./release.sh
#   docker compose -f deploy/docker-compose.yml up -d
#
# Secrets live in deploy/.env (copied from deploy/.env.example, mode 600, never
# committed). Only Caddy publishes ports; Postgres, Redis and gunicorn are
# reachable on the compose network alone.

name: faithtribe

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  build:
    context: ../backend
    args:
      # Sentry's release: `SENTRY_RELEASE=$(git rev-parse --short HEAD) dc build`.
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
  image: faithtribe-api:latest
  env_file: .env
  restart: unless-stopped
  logging: *logging
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    # Same major version as Neon (17.12 on 2026-11-18), so a dump from there
    # restores here without surprises.
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: faithtribe
      POSTGRES_DB: faithtribe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - db-data:/var/lib/postgresql/data
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faithtribe -d faithtribe"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    # One Redis holds the cache (db 0) and the Celery queue (db 1).
    # volatile-lru evicts only keys with an expiry when memory runs out: cache
    # entries always have one, queued tasks never do, so a full Redis drops
    # cache and never work. Append-only keeps queued tasks across a restart.
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy volatile-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    <<: *app
    # The command is the Dockerfile's gunicorn line. The healthcheck only
    # proves gunicorn accepts connections: an HTTP request to 127.0.0.1 would
    # be refused by ALLOWED_HOSTS, which is the point of setting it.
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  worker:
    <<: *app
    # -Q default is not optional: every entry in the beat schedule
    # (backend/backend/celery.py) sends to the queue named "default", and a
    # worker with no -Q listens only to "celery". Both, so a task sent without
    # a queue is collected too.
    #
    # -B runs beat inside this worker. The VPS has 1.6 GB of memory and a
    # separate beat process costs ~100 MB; one child process (--concurrency 1)
    # is plenty for these tasks. It also means there is exactly one beat, so
    # NEVER scale this service past 1: each copy would send every scheduled
    # task again. With more memory, split beat back out into its own service.
    command: >
      celery -A backend worker -B
      -Q default,celery --concurrency 1
      -s /beat/celerybeat-schedule -l info
    volumes:
      - beat-data:/beat

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # The names Caddy serves and fetches certificates for (see Caddyfile).
      CADDY_HOSTS: ${CADDY_HOSTS:-api.thefaithtribe.live}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - logs

  # Dozzle: the log viewer at https://api.thefaithtribe.live/logs/ (Caddy
  # routes /logs there). Read-only: actions and the container shell are off by
  # default and stay off. It reads logs through the Docker socket and shows
  # every container on the box, the cardio-snipe-bot included. The login
  # comes from deploy/dozzle/users.yml, which is made on the server and never
  # committed (docs/ops/11-vps-deployment.md, "Log viewer").
  logs:
    image: amir20/dozzle:v11.4.1
    restart: unless-stopped
    logging: *logging
    environment:
      DOZZLE_BASE: /logs
      DOZZLE_AUTH_PROVIDER: simple
      DOZZLE_AUTH_TTL: 12h
      DOZZLE_NO_ANALYTICS: "true"
      DOZZLE_DISABLE_AVATARS: "true"
      DOZZLE_DISABLE_SETUP_WIZARD: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./dozzle:/data

volumes:
  db-data:
  redis-data:
  beat-data:
  caddy-data:
  caddy-config:
